# Statische Sicherheitsanalyse (C# und JavaScript in den HTML-Seiten), kostenlos für öffentliche Repos.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'   # zusätzlich jeden Montag früh, falls neue Prüfregeln dazukommen

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # C# wird selbst gebaut (nächster Schritt), JavaScript braucht keinen Build
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
      - if: matrix.language == 'csharp'
        run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4
