# Prüft bei jedem Push und Pull Request, dass der Code baut und die Gegnerliste gültig ist.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build -c Release -warnaserror
      - run: dotnet run -c Release --no-build -- --selftest
      - name: Verwundbare Pakete
        run: dotnet list package --vulnerable --include-transitive
