# Baut die DSRTracker.exe und die Offline-Liste DSR-Liste.html öffentlich nachvollziehbar aus genau
# diesem Quellcode, signiert ihre Herkunft (Build-Provenance, prüfbar mit "gh attestation verify")
# und hängt beide samt SHA256-Prüfsumme an den Release an.
name: Release-Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write      # exe an den Release anhängen
  id-token: write      # Herkunftsnachweis signieren (Sigstore)
  attestations: write  # Herkunftsnachweis speichern

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Selbsttest der Gegnerliste
        run: dotnet run -c Release -- --selftest

      - name: Bauen (eigenständige exe, wie build.bat)
        run: dotnet publish DSRTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false -o dist

      - name: Offline-Liste bauen (DSR-Liste.html)
        run: python tools/build_liste.py dist/DSR-Liste.html

      - name: SHA256-Prüfsummen
        shell: pwsh
        run: |
          foreach ($f in "DSRTracker.exe", "DSR-Liste.html") {
            $hash = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "dist/$f.sha256"
            Write-Host "SHA256 ${f}: $hash"
            "### SHA256 $f`n``$hash  $f``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Herkunftsnachweis (Build-Provenance) signieren
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/DSRTracker.exe
            dist/DSR-Liste.html

      - name: An den Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/DSRTracker.exe dist/DSRTracker.exe.sha256 dist/DSR-Liste.html dist/DSR-Liste.html.sha256 update.bat --clobber

      - name: Als Build-Artefakt ablegen (bei manuellem Start)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: DSRTracker
          path: |
            dist/DSRTracker.exe
            dist/DSRTracker.exe.sha256
            dist/DSR-Liste.html
            dist/DSR-Liste.html.sha256
