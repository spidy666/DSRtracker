<!DOCTYPE html>
<html lang="de">
<!--
  DSR Liste – Punkteliste für Dark Souls Remastered zum Abhaken, als einzelne Datei.
  Läuft ohne Server, ohne Internet und ohne den Tracker: Datei herunterladen und im Browser öffnen.
  Gebaut von tools/build_liste.py aus dsr_enemies.json (Gegnerliste) und web/fonts (Schriften).
  Quelle: https://github.com/spidy666/DSRtracker (GPL-3.0)
  Schriften: Cinzel und Alegreya Sans, SIL Open Font License 1.1 (siehe web/fonts/OFL-*.txt im Repository).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:">
<title>DSR Liste</title>
<!-- Tab-Symbol eingebettet, damit der Browser nicht von sich aus nach favicon.ico fragt -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23100c09'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5' stroke='%23d9a441' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
/*FONTS*/
  :root {
    --bg: #100c09; --panel: #19130e; --panel2: #211910; --border: #4a3820;
    --gold: #d9a441; --gold-bright: #f3c45f; --text: #ece3d3; --muted: #9a8f80; --dim: #625a4f; --done: #6f9b5a;
  }
  /* Farbschemata wie Steuerseite und Overlay */
  :root[data-theme="glut"] {
    --bg: #0e0907; --panel: #170e0b; --panel2: #22130d; --border: #4e2416;
    --gold: #ff7a3c; --gold-bright: #ffb066; --text: #f1e6dc; --muted: #a08a7e; --dim: #63514a;
  }
  :root[data-theme="mond"] {
    --bg: #090c12; --panel: #0f141d; --panel2: #151d2a; --border: #2a3a52;
    --gold: #9cc3f0; --gold-bright: #d8ecff; --text: #e6edf5; --muted: #8796aa; --dim: #536073;
  }
  :root[data-theme="abgrund"] {
    --bg: #0b0810; --panel: #120d19; --panel2: #1b1325; --border: #3a254e;
    --gold: #b78cf0; --gold-bright: #e2c8ff; --text: #ece6f4; --muted: #9184a4; --dim: #594d6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Alegreya Sans", "Segoe UI", sans-serif; font-size: 15px;
         font-variant-numeric: lining-nums tabular-nums; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  h1 { font-family: Cinzel, serif; color: var(--gold); letter-spacing: .14em; font-size: 18px; margin: 0; }
  h1 .rz { font-size: .62em; letter-spacing: .08em; margin-left: .4em; opacity: .85; }
  .score { margin-left: auto; font-size: 24px; font-weight: 700; color: var(--gold-bright); }
  .score small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; margin: 10px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); width: 0; transition: width .3s; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 14px; }
  .tools label { display: flex; align-items: center; gap: 6px; }
  select, button, input[type=search] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 14px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--gold); }
  button.danger:hover { border-color: #c0504a; color: #f0a19c; }
  .clock { font-weight: 700; color: var(--text); min-width: 5.2em; }
  main { padding: 16px; columns: 340px; column-gap: 16px; }
  .card { break-inside: avoid; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; margin: 0 0 16px; }
  .card h2 { font-family: Cinzel, serif; color: var(--gold); font-size: 13px; letter-spacing: .14em; margin: 0; padding: 9px 12px;
             border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .card h2 .meta { font-family: "Alegreya Sans", sans-serif; letter-spacing: 0; color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }
  .card.cleared h2 { color: var(--done); }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer; user-select: none; border-top: 1px solid #ffffff08; }
  .row:first-of-type { border-top: 0; }
  .row:hover { background: var(--panel2); }
  .box { width: 18px; height: 18px; flex: none; border: 1px solid var(--dim); border-radius: 3px; display: grid; place-items: center; font-size: 13px; color: var(--bg); }
  .row.done .box { background: var(--gold); border-color: var(--gold); }
  .row.done .box::after { content: "✓"; font-weight: 700; }
  .name { flex: 1; }
  .name .en { color: var(--dim); font-size: .88em; }
  .row.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
  .pts { color: var(--gold); font-weight: 700; }
  .row.done .pts { color: var(--dim); }
  .tip { display: block; color: var(--dim); font-size: 12.5px; }
  .hide-done .row.done, .hide-done .card.cleared { display: none; }
  footer { color: var(--dim); font-size: 12.5px; padding: 0 16px 24px; }
  footer a { color: var(--muted); }
  @media (max-width: 600px) { .score { margin-left: 0; width: 100%; } main { padding: 10px; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">DSR Liste</h1>
    <div class="score" id="score">–</div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tools">
    <label>Liste <select id="variant"><option value="original">Original</option><option value="rando">Randomizer</option></select></label>
    <label>Farbe <select id="theme"><option value="">Gold</option><option value="glut">Asche &amp; Glut</option><option value="mond">Mondlicht</option><option value="abgrund">Abgrund</option></select></label>
    <label>Sortierung <select id="order"><option value="area">nach Gebiet</option><option value="route">nach Route</option></select></label>
    <label><input type="checkbox" id="hideDone"> erledigte ausblenden</label>
    <label><input type="checkbox" id="showTips"> Tipps zeigen</label>
    <input type="search" id="search" placeholder="Gegner suchen …" style="width:150px">
    <span>Uhr <span class="clock" id="clock">0:00:00</span></span>
    <button id="clockBtn">▶ Start</button>
    <button id="clockSet" title="Uhr auf einen Wert setzen">✎</button>
    <button id="clockReset" title="Uhr auf 0">⟲</button>
    <button class="danger" id="reset">Haken zurücksetzen</button>
  </div>
</header>
<main id="list"></main>
<footer>
  Haken und Uhr werden nur in diesem Browser gespeichert. Die Liste läuft ohne Internet und ohne Tracker –
  automatische Erkennung gibt es mit dem <a href="https://github.com/spidy666/DSRtracker" rel="noopener noreferrer">DSR Tracker</a>.
  „Randomizer“: gleiche Plätze und Punkte, aber die Gegner der Randomizer-Version.
</footer>
<script>
"use strict";
// Gegnerliste (Gebiete, Route, Randomizer-Variante) – beim Bauen aus dsr_enemies.json eingesetzt
const DATA = /*DATA*/;

const KEY = "dsr-liste-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- gespeicherter Stand: Haken (gemeinsam für beide Listen, gleiche Plätze), Uhr, Einstellungen
function load() {
  const d = { done: [], theme: "", variant: "original", order: "area", hideDone: false, showTips: false, clock: { acc: 0, since: null } };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.done)) return Object.assign(d, s); } catch { }
  return d;
}
let st = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch { } }

// ---- Ansicht der Liste wie im Tracker: "original" oder "rando" (Namen nach Platz, Zusatzplätze, entfernte Plätze)
function view(variant) {
  const r = variant === "rando" ? DATA.randomizer : null;
  const removed = new Set(r && r.remove || []);
  const areas = DATA.areas.map((area, ai) => ({ de: area.de, en: area.en, enemies: area.enemies.map((e, ei) => {
    const key = `${ai}-${ei}`, n = r && r.names[key];
    return n ? { key, de: n[0], en: n[1], pts: e.pts, tip: `Platz von ${e.de}: ${e.tip || ""}` } : { key, de: e.de, en: e.en, pts: e.pts, tip: e.tip || "" };
  }).filter(x => !removed.has(x.key)) }));
  const route = DATA.route.map(rt => ({ title: rt.title, keys: rt.keys.filter(k => !removed.has(k)) }));
  if (r) {
    const next = DATA.areas.map(a => a.enemies.length), lastAfter = {};
    for (const x of r.extra || []) {
      const key = `${x.area}-${next[x.area]++}`, anchor = lastAfter[x.after] || x.after;
      lastAfter[x.after] = key;
      const list = areas[x.area].enemies, i = list.findIndex(t => t.key === anchor);
      list.splice(i < 0 ? list.length : i + 1, 0, { key, de: x.de, en: x.en, pts: x.pts, tip: x.tip || "" });
      for (const rt of route) { const j = rt.keys.indexOf(anchor); if (j >= 0) { rt.keys.splice(j + 1, 0, key); break; } }
    }
  }
  return { areas, route };
}

// Gruppen: Gebiete oder Routen-Kapitel
function groups(v) {
  if (st.order !== "route") return v.areas;
  const byKey = {};
  v.areas.forEach(a => a.enemies.forEach(e => byKey[e.key] = e));
  return v.route.map(r => ({ de: r.title, enemies: r.keys.map(k => byKey[k]).filter(Boolean) }));
}

function render() {
  if (!DATA.randomizer) $("variant").closest("label").hidden = true;
  const variant = st.variant === "rando" && DATA.randomizer ? "rando" : "original";
  const v = view(variant), done = new Set(st.done), q = $("search").value.trim().toLowerCase();
  const all = v.areas.flatMap(a => a.enemies);
  const max = all.reduce((t, e) => t + e.pts, 0), got = all.filter(e => done.has(e.key));
  const total = got.reduce((t, e) => t + e.pts, 0);
  $("title").innerHTML = variant === "rando" ? `DSR Liste<span class="rz">${esc(DATA.randomizer.title || "Randomizer")}</span>` : "DSR Liste";
  $("score").innerHTML = `${total} <small>/ ${max} Pkt · ${got.length}/${all.length} Feinde</small>`;
  $("bar").style.width = (max ? 100 * total / max : 0) + "%";
  document.title = `${total}/${max} · DSR Liste`;
  if (st.theme) document.documentElement.dataset.theme = st.theme; else delete document.documentElement.dataset.theme;
  $("theme").value = st.theme;
  $("variant").value = variant; $("order").value = st.order; $("hideDone").checked = st.hideDone; $("showTips").checked = st.showTips;
  document.body.classList.toggle("hide-done", st.hideDone && !q);

  $("list").innerHTML = groups(v).map(g => {
    let en = g.enemies;
    if (q) en = en.filter(e => (e.de + " " + e.en).toLowerCase().includes(q));
    if (!en.length) return "";
    const d = g.enemies.filter(e => done.has(e.key));
    const cleared = d.length === g.enemies.length;
    return `<section class="card${cleared ? " cleared" : ""}"><h2>${esc(g.de)}<span class="meta">${d.length}/${g.enemies.length} · ${d.reduce((t, e) => t + e.pts, 0)}/${g.enemies.reduce((t, e) => t + e.pts, 0)} Pkt</span></h2>`
      + en.map(e => `<div class="row${done.has(e.key) ? " done" : ""}" data-key="${esc(e.key)}"><span class="box"></span>`
        + `<span class="name">${esc(e.de)}${e.en && e.en !== e.de ? ` <span class="en">/ ${esc(e.en)}</span>` : ""}`
        + `${st.showTips && e.tip ? `<span class="tip">${esc(e.tip)}</span>` : ""}</span><span class="pts">${e.pts}</span></div>`).join("")
      + `</section>`;
  }).join("") || `<p style="color:var(--muted)">Kein Gegner passt zur Suche.</p>`;
  showClock();
}

// ---- Uhr (Start/Pause, läuft auch nach dem Schließen weiter, weil die Startzeit gespeichert ist)
const fmt = ms => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const clockMs = () => st.clock.acc + (st.clock.since ? Date.now() - st.clock.since : 0);
function showClock() { $("clock").textContent = fmt(clockMs()); $("clockBtn").textContent = st.clock.since ? "⏸ Pause" : "▶ Start"; }
setInterval(showClock, 1000);
const parseTime = txt => { const p = String(txt).trim().split(":"); if (p.length < 2 || p.length > 3 || p.some(x => !/^\d{1,3}$/.test(x.trim()))) return null;
  const n = p.map(x => parseInt(x, 10)), [h, m, s] = p.length === 3 ? n : [0, n[0], n[1]];
  return m > 59 || s > 59 ? null : ((h * 60 + m) * 60 + s) * 1000; };

// ---- Bedienung
$("list").addEventListener("click", ev => {
  const row = ev.target.closest(".row"); if (!row) return;
  const k = row.dataset.key, i = st.done.indexOf(k);
  if (i >= 0) st.done.splice(i, 1); else st.done.push(k);
  save(); render();
});
$("theme").onchange = () => { st.theme = $("theme").value; save(); render(); };
$("variant").onchange = () => { st.variant = $("variant").value; save(); render(); };
$("order").onchange = () => { st.order = $("order").value; save(); render(); };
$("hideDone").onchange = () => { st.hideDone = $("hideDone").checked; save(); render(); };
$("showTips").onchange = () => { st.showTips = $("showTips").checked; save(); render(); };
$("search").oninput = render;
$("clockBtn").onclick = () => {
  if (st.clock.since) { st.clock.acc += Date.now() - st.clock.since; st.clock.since = null; } else st.clock.since = Date.now();
  save(); showClock();
};
$("clockSet").onclick = () => {
  const txt = prompt("Uhr setzen (h:mm:ss, z. B. 1:23:45 – oder mm:ss):", fmt(clockMs()));
  if (txt === null) return;
  const ms = parseTime(txt);
  if (ms === null) { alert("Bitte so eingeben: h:mm:ss (z. B. 1:23:45) oder mm:ss."); return; }
  st.clock.acc = ms; if (st.clock.since) st.clock.since = Date.now();
  save(); showClock();
};
$("clockReset").onclick = () => { if (confirm("Uhr auf 0 setzen?")) { st.clock = { acc: 0, since: null }; save(); showClock(); } };
$("reset").onclick = () => { if (confirm("Alle Haken zurücksetzen?")) { st.done = []; save(); render(); } };
// in einem zweiten Tab geändert? Dann neu laden
window.addEventListener("storage", e => { if (e.key === KEY) { st = load(); render(); } });
render();
</script>
</body>
</html>
